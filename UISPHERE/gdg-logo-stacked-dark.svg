<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none" width="100%" height="100%">
  <!-- Centered GDG Emblem -->
  <g transform="translate(100, 10)">
    <!-- Left Bracket < -->
    <rect x="36.5" y="6" width="38" height="15" rx="7.5" transform="rotate(45 36.5 6)" fill="#EA4335" />
    <rect x="9.5" y="47.5" width="38" height="15" rx="7.5" transform="rotate(-45 9.5 47.5)" fill="#4285F4" />
    
    <!-- Right Bracket > -->
    <rect x="56.5" y="33" width="38" height="15" rx="7.5" transform="rotate(-45 56.5 33)" fill="#34A853" />
    <rect x="83.5" y="20" width="38" height="15" rx="7.5" transform="rotate(45 83.5 20)" fill="#FBBC05" />
  </g>

  <!-- Typography Stacked & Centered -->
  <text x="160" y="118" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC" letter-spacing="-0.3">Google</text>
  <text x="160" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC" letter-spacing="-0.3">Developer Group</text>
  <text x="160" y="186" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="14.5" font-weight="500" fill="#60A5FA" letter-spacing="0.1">Institute of Technical Education &amp; Research</text>
</svg>
